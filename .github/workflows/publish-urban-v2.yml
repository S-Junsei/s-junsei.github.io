name: Publish Urban Lab V2
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-urban-v2.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Copy reviewed V2 build
        run: |
          mkdir -p urban-sim
          BASE="https://raw.githubusercontent.com/S-Junsei/free1/8ab3aec3228e0487493a52ee6fe2c26839e39c77/urban-sim"
          curl -fsSL "$BASE/index.html" -o urban-sim/index.html
          curl -fsSL "$BASE/style.css" -o urban-sim/style.css
          curl -fsSL "$BASE/app.js" -o urban-sim/app.js
          curl -fsSL "$BASE/README.md" -o urban-sim/README.md
          node --check urban-sim/app.js
          grep -q "Urban Lab V2" urban-sim/README.md
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/publish-urban-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Urban Lab V2"
          git push origin HEAD:master