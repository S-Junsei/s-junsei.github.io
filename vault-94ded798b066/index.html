<script>
'use strict';
const appData=JSON.parse(document.getElementById('payload').textContent),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const status=document.getElementById('status'),button=document.getElementById('unlock'),frame=document.getElementById('dashboard'),login=document.getElementById('login');
let activeKey=null;
const vaultStore='encrypted-dash-state-v1';
function stringToBytes(s){return new TextEncoder().encode(s)}
async function encrypt(data,key){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,stringToBytes(data));return JSON.stringify({iv:btoa(String.fromCharCode(...iv)),cipher:btoa(String.fromCharCode(...new Uint8Array(c)))});}
async function decrypt(saved,key){let x=JSON.parse(saved),iv=b64(x.iv),data=b64(x.cipher);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data));}
async function getKey(pass){const root=await crypto.subtle.importKey('raw',stringToBytes(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(appData.salt),iterations:appData.iterations,hash:'SHA-256'},root,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);}
async function unlock(e){e.preventDefault();button.disabled=true;status.textContent='暗号化された画面を復号しています…';let pass=document.getElementById('password').value;try{const key=await getKey(pass);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(appData.iv),additionalData:stringToBytes('private-dashboard-v1')},key,b64(appData.data));let html=new TextDecoder().decode(plain);let restored=null;try{const saved=localStorage.getItem(vaultStore);if(saved)restored=JSON.parse(await decrypt(saved,key));}catch(err){console.warn('Saved settings unavailable');}
const starter='<'+'script>window.__RESTORED_STATE__='+JSON.stringify(restored).replace(/</g,'\u003c')+';</'+'script>';
html=html.replace('<head>','<head>'+starter);
activeKey=key;frame.srcdoc=html;frame.style.display='block';document.getElementById('back').style.display='block';login.classList.add('hidden');document.getElementById('password').value='';pass='';status.textContent='';}catch(err){status.textContent='パスワードが一致しないか、復号に失敗しました。';console.warn('Vault decryption error');}finally{button.disabled=false;}}
document.getElementById('form').addEventListener('submit',unlock);
document.getElementById('toggle').addEventListener('click',()=>{const inp=document.getElementById('password');inp.type=inp.type==='password'?'text':'password';document.getElementById('toggle').textContent=inp.type==='password'?'表示':'隠す';});
window.addEventListener('message',async e=>{if(e.source!==frame.contentWindow||!activeKey||!e.data||e.data.type!=='vault:save')return;try{const output=await encrypt(JSON.stringify(e.data.payload),activeKey);localStorage.setItem(vaultStore,output)}catch(err){console.warn('Encrypted local save failed')}});
document.getElementById('back').addEventListener('click',()=>{activeKey=null;frame.srcdoc='';frame.style.display='none';document.getElementById('back').style.display='none';login.classList.remove('hidden');status.textContent='ロックしました。';document.getElementById('password').focus();});
</script></body></html>
